<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmFlix</title>
    <link rel="stylesheet" href="style.css">
    <link rel = "stylesheet" href = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" ">
    
</head>
 <!--Christian Torres Work starts here-->
<body>

    <nav class = "navbar"> 
        <div class = "navbar-container">
            <div class = "logo-container"> <h1 class = "logo"> FilmFlex </h1> </div>
             <div class = "profile-container"> 
                <img class = "user-profile" src = "images.jpeg" alt = profilepicture>
                    <div class = "profile-container-text"> 
                        <span class = "profile-text"> Profile </span>
                        <i class="fa-solid fa-angle-down"></i>
                    </div>
        
                </div>
            <div class ="menu-container">
                <ul class ="menu-list"> 
                    <li class ="menu-list-item"> Home </li>
                    <li class ="menu-list-item"> Movies </li>
                    <li class ="menu-list-item"> Popular </li>
                
                </ul>
            </div>
        </div>
    </nav>
 <!--Christian Torres Work Ends here-->

    <h1>Trending Movies</h1>
    <div id="movie-grid" class="movie-grid"></div>

    <div class="review-container">
        <h2>Add to Watchlist</h2>
        <form id="movieForm">
            <label for="movieId">Movie ID:</label>
            <input type="text" id="movieId" placeholder="e.g., tt0111161" required>

            <label for="category">Category:</label>
            <select id="category">
                <option value="Movie">Movie</option>
                <option value="TV Show">TV Show</option>
                <option value="Documentary">Documentary</option>
            </select>

            <label for="genre">Genre:</label>
            <input type="text" id="genre" placeholder="e.g., Action, Sci-Fi" required>

            <label for="directorCast">Director / Cast:</label>
            <input type="text" id="directorCast" placeholder="e.g., Christopher Nolan, Leonardo DiCaprio" required>

            <label for="year">Release Year:</label>
            <input type="number" id="year" placeholder="2010" required>

            <button type="submit">Save to Watchlist</button>
        </form>
    </div>

    <script src="movie.js"></script>
    <script src="app.js"></script>
</body>
</html>
