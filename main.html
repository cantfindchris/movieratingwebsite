<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmFlix</title>
    >
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="logo"> 
        <img src="/images/logo.png" alt="FilmFlix Logo" width="50" height="50">
        <h1>FilmFlix</h1>
    </div>

    <h1>Trending Movies</h1>
    <div id="movie-grid" class="movie-grid"></div>

    <div class="review-container">
        <h2>Add to Watchlist</h2>
        <form id="movieForm">
            <label for="movieId">Movie ID:</label>
            <input type="text" id="movieId" placeholder="e.g., tt0111161" required>

            <label for="category">Category:</label>
            <select id="category">
                <option value="Movie">Movie</option>
                <option value="TV Show">TV Show</option>
                <option value="Documentary">Documentary</option>
            </select>

            <label for="genre">Genre:</label>
            <input type="text" id="genre" placeholder="e.g., Action, Sci-Fi" required>

            <label for="directorCast">Director / Cast:</label>
            <input type="text" id="directorCast" placeholder="e.g., Christopher Nolan, Leonardo DiCaprio" required>

            <label for="year">Release Year:</label>
            <input type="number" id="year" placeholder="2010" required>

            <button type="submit">Save to Watchlist</button>
        </form>
    </div>

    <div class="filter-container">
    <h2>My Watchlist</h2>
    
    <label for="statusFilter">Status:</label>
    <select id="statusFilter">
        <option value="All">All</option>
        <option value="Want to Watch">Want to Watch</option>
        <option value="Watched">Watched</option>
    </select>

    <label for="genreFilter">Genre:</label>
    <input type="text" id="genreFilter" placeholder="Type to filter...">
</div>
<div id="watchlist-grid" class="movie-grid"></div>
  
    <!-- JavaScript files grouped at the bottom for better performance -->
    <script src="movie.js"></script>
    <script src="app.js"></script>

</body>
</html>
