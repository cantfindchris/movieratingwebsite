<!DOCTYPE html>

<html>
    <head>
        <meta charset = 'utf- 8'>
        <title> Movierating</title>

        <link rel = "stylesheet" href = "/style.css">
        <style>
            body {
                background: linear-gradient(180deg, #0d1117 0%, #07090e 100%);
                min-height: 100vh;
                margin: 0;
            } 

            .stars {
                color: #1e7923;
                font-size: 1.1rem;
                margin-top: 5px;
                display: block;
            }

            .logo{

            }

            .review-container {
                background-color: #1f1f1f;
                width:  100%;
                max-width: 550px;
                padding: 30px
                border-radius: 12px
                box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.5);
            }



        </style>

    </head> 
    
    <body>
  <div class="review-container">
    <h2>Add to Watchlist</h2>
    <form id="movieForm">
      <label for="movieId">Movie ID:</label>
      <input type="text" id="movieId" placeholder="e.g., tt0111161" required>

      <label for="category">Category:</label>
      <select id="category">
        <option value="Movie">Movie</option>
        <option value="TV Show">TV Show</option>
        <option value="Documentary">Documentary</option>
      </select>

      <label for="genre">Genre:</label>
      <input type="text" id="genre" placeholder="e.g., Action, Sci-Fi" required>

      <label for="directorCast">Director / Cast:</label>
      <input type="text" id="directorCast" placeholder="e.g., Christopher Nolan, Leonardo DiCaprio" required>

      <label for="year">Release Year:</label>
      <input type="number" id="year" placeholder="2010" required>

      <button type="submit">Save to Watchlist</button>
    </form>
  </div>
  
  <script src="app.js"></script>
</body>


</html>
